# Publishes the site to GitHub Pages. This only runs for a release: either one
# created by release.yml on a merge to the mainline, or one created by hand in
# the GitHub UI. Pushes on their own never change what is live.

name: Deploy

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      ref:
        description: 'Tag, branch or SHA to build and publish'
        required: false
        type: string
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and publish to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout the released commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.release.tag_name || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Report the version being published
        run: echo "Publishing v$(node -p "require('./package.json').version")"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
